<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Nightly backups from WHM servers to S3-compatible object storage, keeping 10 daily and 12 monthly">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06142a"/><stop offset=".55" stop-color="#0b2a4a"/><stop offset="1" stop-color="#0c4a6e"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" opacity=".07"/>
  </pattern>
  <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<rect width="1200" height="300" rx="20" fill="url(#bg)"/><rect width="1200" height="300" rx="20" fill="url(#dots)"/>
<text x="24" y="34" fill="#7dd3fc" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="12" letter-spacing="1.5">OFF-SITE BACKUPS · NIGHTLY · S3-COMPATIBLE OBJECT STORAGE</text>
<text x="145" y="76" text-anchor="middle" fill="#e0f2fe" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700">WHM / Linux servers</text>
