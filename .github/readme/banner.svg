<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Md Mojahedul Islam: CTO and Lead Software Engineer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06142a"/><stop offset=".55" stop-color="#0b2a4a"/><stop offset="1" stop-color="#0c4a6e"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" opacity=".07"/>
  </pattern>
  <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <clipPath id="clip"><circle cx="0" cy="0" r="88"/></clipPath>
  <radialGradient id="glow"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="400" rx="22" fill="url(#bg)"/>
<rect width="1200" height="400" rx="22" fill="url(#dots)"/>
<circle cx="1080" cy="40" r="220" fill="url(#glow)"><animate attributeName="r" values="200;240;200" dur="8s" repeatCount="indefinite"/></circle>

<g transform="translate(150 200)">
  <circle r="102" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="10 8">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#38bdf8"><animateMotion dur="6s" repeatCount="indefinite" begin="0.0s" path="M0,-102 a102,102 0 1,1 0,204 a102,102 0 1,1 0,-204"/></circle><circle r="3" fill="#38bdf8"><animateMotion dur="7s" repeatCount="indefinite" begin="0.9s" path="M0,-102 a102,102 0 1,1 0,204 a102,102 0 1,1 0,-204"/></circle><circle r="3" fill="#38bdf8"><animateMotion dur="8s" repeatCount="indefinite" begin="1.8s" path="M0,-102 a102,102 0 1,1 0,204 a102,102 0 1,1 0,-204"/></circle>
  <circle r="92" fill="#06142a"/>
  <image href="data:image/jpeg;base64," x="-88" y="-88" width="176" height="176" clip-path="url(#clip)" preserveAspectRatio="xMidYMid slice"/>
  <g transform="translate(62 66)"><circle r="13" fill="#22c55e" stroke="#06142a" stroke-width="4"/>
    <circle r="13" fill="none" stroke="#22c55e"><animate attributeName="r" values="13;24" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"/></circle></g>
</g>

<g transform="translate(290 112)" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <text y="0" fill="#7dd3fc" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="15" letter-spacing="2">HI, I'M</text>
  <text y="52" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="-1">Md Mojahedul Islam</text>
  <text y="92" fill="url(#accent)" font-size="24" font-weight="700">CTO &amp; Lead Software Engineer</text>
  <text y="122" fill="#cbd5e1" font-size="17">Light Technologies · Dhaka, Bangladesh</text>
  <text y="160" fill="#94a3b8" font-size="15.5">I build school platforms, ERPs and single-binary Go tools,</text>
  <text y="182" fill="#94a3b8" font-size="15.5">and I run the Linux servers they live on.</text>
  <g transform="translate(0 206)"><g transform="translate(0 0)"><rect width="78" height="28" rx="14" fill="#ffffff" fill-opacity=".08" stroke="#7dd3fc" stroke-opacity=".35"/><text x="39" y="19" text-anchor="middle" fill="#e0f2fe" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Laravel</text></g><g transform="translate(86 0)"><rect width="35" height="28" rx="14" fill="#ffffff" fill-opacity=".08" stroke="#7dd3fc" stroke-opacity=".35"/><text x="18" y="19" text-anchor="middle" fill="#e0f2fe" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Go</text></g><g transform="translate(129 0)"><rect width="61" height="28" rx="14" fill="#ffffff" fill-opacity=".08" stroke="#7dd3fc" stroke-opacity=".35"/><text x="30" y="19" text-anchor="middle" fill="#e0f2fe" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Linux</text></g><g transform="translate(198 0)"><rect width="87" height="28" rx="14" fill="#ffffff" fill-opacity=".08" stroke="#7dd3fc" stroke-opacity=".35"/><text x="43" y="19" text-anchor="middle" fill="#e0f2fe" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Security</text></g><g transform="translate(293 0)"><rect width="78" height="28" rx="14" fill="#ffffff" fill-opacity=".08" stroke="#7dd3fc" stroke-opacity=".35"/><text x="39" y="19" text-anchor="middle" fill="#e0f2fe" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Flutter</text></g><g transform="translate(379 0)"><rect width="70" height="28" rx="14" fill="#ffffff" fill-opacity=".08" stroke="#7dd3fc" stroke-opacity=".35"/><text x="35" y="19" text-anchor="middle" fill="#e0f2fe" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Vue.js</text></g></g>
</g>

<g transform="translate(820 78)">
  <rect width="340" height="250" rx="14" fill="#020617" fill-opacity=".85" stroke="#334155"/>
  <rect width="340" height="34" rx="14" fill="#ffffff" fill-opacity=".05"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="180" y="22" text-anchor="middle" fill="#64748b" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="12">visitor@mojahed: ~</text>
  <g transform="translate(18 62)"><text x="0" y="0" fill="#e2e8f0" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="15">$ whoami<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.706;1" dur="0.85s" fill="freeze"/></text><text x="0" y="26" fill="#7dd3fc" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="15">cto @ light-technologies<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.821;1" dur="1.40s" fill="freeze"/></text><text x="0" y="52" fill="#e2e8f0" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="15">$ uptime<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.872;1" dur="1.95s" fill="freeze"/></text><text x="0" y="78" fill="#7dd3fc" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="15">4+ years in production<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.900;1" dur="2.50s" fill="freeze"/></text><text x="0" y="104" fill="#e2e8f0" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="15">$ ls ~/work<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.918;1" dur="3.05s" fill="freeze"/></text><text x="0" y="130" fill="#86efac" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="15">eduplus/  publication-erp/  mds/<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.931;1" dur="3.60s" fill="freeze"/></text><text x="0" y="156" fill="#e2e8f0" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="15">$ sudo hire mojahed<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.940;1" dur="4.15s" fill="freeze"/></text><text x="0" y="182" fill="#fcd34d" font-family="Consolas, 'SFMono-Regular', Menlo, 'DejaVu Sans Mono', monospace" font-size="15">access granted ✔<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.947;1" dur="4.70s" fill="freeze"/></text>
    <rect x="138" y="169" width="9" height="17" fill="#4ade80">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</g>
</svg>