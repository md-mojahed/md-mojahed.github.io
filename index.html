  <script>
    // Pick the theme before anything paints, so there is no flash.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>This portfolio needs JavaScript. Contact: dev.mojahedul@gmail.com · +880 1861 583588</noscript>
  <script src="main.js"></script>
  <script>
    var app = Elm.Main.init({
      node: document.getElementById('app'),
      flags: { dark: document.documentElement.getAttribute('data-theme') === 'dark' }
    });

    app.ports.saveTheme.subscribe(function (theme) {
      document.documentElement.setAttribute('data-theme', theme);
      try { localStorage.setItem('theme', theme); } catch (e) {}
    });

    app.ports.copyText.subscribe(function (text) {
      if (navigator.clipboard) { navigator.clipboard.writeText(text).catch(function () {}); }
    });

    // Scroll-spy: tell Elm which section is in the middle of the screen.
    requestAnimationFrame(function () {
      if (!('IntersectionObserver' in window)) return;
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) app.ports.activeSection.send(e.target.id);
        });
      }, { rootMargin: '-40% 0px -55% 0px' });
      document.querySelectorAll('main section[id]').forEach(function (s) { io.observe(s); });
    });
  </script>
</body>
